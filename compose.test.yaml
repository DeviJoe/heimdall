services:
  tests:
    build: {context: ., target: tests}
    mem_limit: 768m
    environment:
      GOMEMLIMIT: 400MiB
      HEIMDALL_TEST_DATABASE_DSN: postgres://linpam:${HEIMDALL_DATABASE_PASSWORD}@postgres:5432/linpam_test?sslmode=disable
    depends_on: {postgres: {condition: service_healthy}}
  enrollment-node:
    profiles: [acceptance]
    build: {context: ., target: node}
    mem_limit: 128m
    environment:
      HEIMDALL_JOIN_TOKEN: ${HEIMDALL_ACCEPTANCE_JOIN_TOKEN:-not-configured}
      HEIMDALL_NODE_NAME: enrollment-acceptance
      HEIMDALL_AGENT_API: https://gateway:8443
      HEIMDALL_AGENT_GRPC: gateway:9443
    volumes: [trust:/trust:ro]
