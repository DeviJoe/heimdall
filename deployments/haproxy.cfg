global
  log stdout format raw local0
  maxconn 50000
defaults
  mode tcp
  log global
  timeout connect 5s
  timeout client 7h
  timeout server 7h
resolvers docker
  nameserver dns 127.0.0.11:53
  accepted_payload_size 8192
  hold valid 5s
  hold obsolete 5s
frontend api
  timeout client 20s
  bind :8443
  default_backend api_nodes
  timeout server 20s
backend api_nodes
  timeout server 20s
  balance leastconn
  server-template cp 1-16 controlplane:8443 check inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
frontend agents
  bind :9443
  default_backend agent_nodes
backend agent_nodes
  balance leastconn
  server-template cp 1-16 controlplane:9443 check inter 1s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
