global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: heimdall
    basic_auth:
      username: prometheus
      password_file: /run/secrets/metrics_password
    dns_sd_configs:
      - names: [controlplane]
        type: A
        port: 9090
        refresh_interval: 5s
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
  - job_name: heimdall-load
    basic_auth:
      username: prometheus
      password_file: /run/secrets/metrics_password
    dns_sd_configs:
      - names: [load-controlplane]
        type: A
        port: 9090
        refresh_interval: 5s
  - job_name: rabbitmq-load
    dns_sd_configs:
      - names: [load-rabbitmq]
        type: A
        port: 15692
        refresh_interval: 5s
