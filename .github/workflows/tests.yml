name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.26.0'}
      - uses: actions/setup-node@v4
        with: {node-version: '26', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: make test-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: unit-web-report, path: .local/web-unit.xml}
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make demo
      - uses: actions/setup-node@v4
        with: {node-version: '26', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: make test-regression-ui test-regression-db test-regression-api
      - name: Diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-reports
          path: |
            .local/*verification.json
            .local/web-regression.xml
  load:
    # Manual only: a load run must not consume the regression runner by accident.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make demo
      - run: HEIMDALL_LOAD_AGENTS=20000 make test-load > .local/load-report.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: load-report, path: .local/load-report.log}
